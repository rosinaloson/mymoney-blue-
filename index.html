<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MY MONEY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#EAF7FF;
  --cream-deep:#D6F0FF;
  --pink:#1696D2;
  --pink-deep:#E53935;
  --pink-pale:#E3F4FF;
  --lavender:#BDE3F7;
  --lavender-deep:#198CC8;
  --ink:#193B52;
  --ink-soft:#557487;
  --warn:#F2C94C;
  --warn-bg:#FBEBD8;
  --white:#FFFFFF;
  --good:#62B77A;
  --shadow-off:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans TC',sans-serif;
  background-color:#1696D2;
  background-image:radial-gradient(circle, rgba(255,255,255,.88) 1.5px, transparent 1.7px);
  background-size:18px 18px;
  color:var(--ink);
  min-height:100vh;
  display:flex;
  justify-content:center;
}
.pixel{font-family:'Press Start 2P',monospace;}
#appshell{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:var(--cream);
  position:relative;
  display:flex;
  flex-direction:column;
  border-left:3px solid var(--ink);
  border-right:3px solid var(--ink);
  overflow-x:hidden;
}
/* ---- title bar ---- */
.titlebar{
  background:var(--pink);
  border-bottom:3px solid var(--ink);
  padding:10px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:50;
}
.titlebar .ttl{
  font-family:'Press Start 2P',monospace;
  font-size:11px;
  color:var(--white);
  text-shadow:2px 2px 0 var(--pink-deep);
  letter-spacing:1px;
}
.titlebar .dots{display:flex;gap:5px;}
.titlebar .dots span{
  width:10px;height:10px;
  background:var(--cream);
  border:2px solid var(--ink);
  display:block;
}
.titlebar .dots span:nth-child(1){background:var(--pink-pale);}
.titlebar .dots span:nth-child(2){background:var(--lavender);}
.titlebar .dots span:nth-child(3){background:var(--cream);}

/* ---- generic pixel box ---- */
.box{
  background:var(--white);
  border:3px solid var(--ink);
  box-shadow: var(--shadow-off) var(--shadow-off) 0 0 var(--ink);
  padding:14px;
}
.box-pink{background:var(--pink-pale);}
.box-lav{background:#F1EBFD;}
.box-cream{background:var(--cream-deep);}

btn, .btn{
  font-family:'Noto Sans TC',sans-serif;
  font-weight:700;
  border:3px solid var(--ink);
  background:var(--pink);
  color:var(--white);
  padding:10px 14px;
  box-shadow:3px 3px 0 0 var(--ink);
  cursor:pointer;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  user-select:none;
}
.btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 0 var(--ink);}
.btn-lav{background:var(--lavender-deep);}
.btn-outline{background:var(--white);color:var(--ink);}
.btn-warn{background:var(--warn);}
.btn-block{width:100%;}
.btn-sm{padding:6px 10px;font-size:12px;box-shadow:2px 2px 0 0 var(--ink);}

input,select,textarea{
  font-family:'Noto Sans TC',sans-serif;
  border:3px solid var(--ink);
  background:var(--white);
  padding:10px;
  font-size:15px;
  color:var(--ink);
  width:100%;
}
input:focus,select:focus,textarea:focus{outline:3px solid var(--lavender-deep);outline-offset:1px;}
label{font-size:12px;color:var(--ink-soft);font-weight:700;display:block;margin:10px 0 4px;}

#screen{
  flex:1;
  padding:14px 14px 100px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* ---- bottom nav ---- */
.bottomnav{
  position:sticky;
  bottom:0;
  background:var(--white);
  border-top:3px solid var(--ink);
  display:flex;
  z-index:50;
}
.navbtn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:9px 0 7px;
  background:none;
  border:none;
  font-size:10px;
  color:var(--ink-soft);
  cursor:pointer;
  font-weight:700;
}
.navbtn .ic{font-size:19px;}
.navbtn.active{color:var(--pink-deep);background:var(--pink-pale);}

.fab{
  position:fixed;
  right:calc(50% - 215px + 18px);
  bottom:76px;
  width:58px;height:58px;
  background:var(--pink-deep);
  color:var(--white);
  border:3px solid var(--ink);
  box-shadow:3px 3px 0 0 var(--ink);
  font-size:26px;
  font-weight:900;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  z-index:60;
}
@media (max-width:466px){
  .fab{right:18px;}
}
.fab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 0 var(--ink);}

h1,h2,h3{margin:0;font-family:'Noto Sans TC',sans-serif;}
.sec-title{
  font-size:13px;color:var(--ink-soft);font-weight:900;
  display:flex;align-items:center;gap:6px;margin-bottom:8px;
}
.rowsplit{display:flex;justify-content:space-between;align-items:center;}
.muted{color:var(--ink-soft);font-size:12px;}
.big-money{font-family:'Press Start 2P',monospace;font-size:22px;color:var(--pink-deep);line-height:1.4;}
.mid-money{font-family:'Press Start 2P',monospace;font-size:15px;color:var(--ink);}

.progress-wrap{
  background:var(--cream-deep);
  border:2px solid var(--ink);
  height:14px;
  width:100%;
  margin:6px 0 2px;
  position:relative;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:repeating-linear-gradient(90deg, var(--pink), var(--pink) 6px, var(--pink-deep) 6px, var(--pink-deep) 12px);
}
.progress-fill.warn{background:repeating-linear-gradient(90deg, var(--warn), var(--warn) 6px, #d69354 6px, #d69354 12px);}
.progress-fill.good{background:repeating-linear-gradient(90deg, var(--good), var(--good) 6px, #74a685 6px, #74a685 12px);}

.list-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;
  border-bottom:2px dashed var(--pink-pale);
}
.list-item:last-child{border-bottom:none;}
.li-left{display:flex;align-items:center;gap:10px;}
.li-icon{
  width:34px;height:34px;background:var(--pink-pale);
  border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.li-title{font-weight:700;font-size:14px;}
.li-sub{font-size:11px;color:var(--ink-soft);}
.li-amt{font-family:'Press Start 2P',monospace;font-size:12px;}
.li-amt.neg{color:var(--pink-deep);}
.li-amt.pos{color:var(--good);}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

.pick-tile{
  border:3px solid var(--ink);
  background:var(--white);
  padding:14px 8px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;
  box-shadow:2px 2px 0 0 var(--ink);
  font-weight:700;
  font-size:13px;
  text-align:center;
}
.pick-tile:active{transform:translate(2px,2px);box-shadow:0 0 0 0 var(--ink);}
.pick-tile .em{font-size:24px;}
.pick-tile.selected{background:var(--pink-pale);border-color:var(--pink-deep);}
.pick-tile .sub{font-size:10px;color:var(--ink-soft);font-weight:400;}

.stepbar{display:flex;gap:6px;margin-bottom:4px;}
.stepbar .dot{flex:1;height:6px;background:var(--cream-deep);border:2px solid var(--ink);}
.stepbar .dot.on{background:var(--pink-deep);}

.overlay{
  position:fixed;inset:0;
  background:rgba(90,58,72,0.45);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:100;
}
.sheet{
  width:100%;max-width:430px;
  background:var(--cream);
  border-top:3px solid var(--ink);
  max-height:88vh;
  overflow-y:auto;
  padding:16px 16px 24px;
}
.sheet-handle{width:40px;height:5px;background:var(--ink-soft);opacity:.3;margin:0 auto 10px;border-radius:3px;}
.closebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.xbtn{
  width:30px;height:30px;border:2px solid var(--ink);background:var(--white);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:900;
}

.amt-display{
  font-family:'Press Start 2P',monospace;
  font-size:34px;
  text-align:center;
  padding:18px 6px;
  color:var(--pink-deep);
  background:var(--white);
  border:3px solid var(--ink);
  box-shadow:var(--shadow-off) var(--shadow-off) 0 0 var(--ink);
  word-break:break-all;
}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.keypad button{
  font-family:'Press Start 2P',monospace;
  font-size:16px;
  padding:16px 0;
  border:3px solid var(--ink);
  background:var(--white);
  box-shadow:2px 2px 0 0 var(--ink);
  cursor:pointer;
}
.keypad button:active{transform:translate(2px,2px);box-shadow:0 0 0 0 var(--ink);}

.tag{
  display:inline-block;
  font-size:10px;font-weight:700;
  border:2px solid var(--ink);
  padding:2px 6px;
  background:var(--lavender);
}
.tag.warn{background:var(--warn-bg);color:#8a5a20;border-color:#c98a3f;}
.empty-hint{
  text-align:center;padding:26px 10px;color:var(--ink-soft);font-size:13px;
}
.toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%);
  background:var(--ink);color:var(--white);
  padding:9px 16px;font-size:13px;font-weight:700;
  border:2px solid var(--ink);
  z-index:200;
  box-shadow:3px 3px 0 0 var(--pink-deep);
}
.iconpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.iconpick span{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--ink);background:var(--white);cursor:pointer;font-size:16px;
}
.iconpick span.sel{background:var(--pink-pale);border-color:var(--pink-deep);}
.loading{
  display:flex;align-items:center;justify-content:center;height:60vh;
  font-family:'Press Start 2P',monospace;font-size:12px;color:var(--pink-deep);
  flex-direction:column;gap:14px;
}
.blink{animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:0.2;}}
.floathdr{display:flex;justify-content:space-between;align-items:center;}
.linkbtn{background:none;border:none;color:var(--pink-deep);font-weight:700;font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}
hr.dash{border:none;border-top:2px dashed var(--pink-pale);margin:10px 0;}
</style>
</head>
<body>
<div id="appshell">
  <div class="titlebar">
    <div class="ttl">MY MONEY</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <div id="screen"><div class="loading"><div class="pixel blink">LOADING...</div></div></div>
  <div class="bottomnav" id="bottomnav"></div>
</div>
<button class="fab" onclick="openAdd('expense')">＋</button>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ============ storage helpers (standard browser localStorage) ============ */
const STORE_KEY = "moneyapp_state_v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* private mode / corrupted data -> use default */ }
  return null;
}
let saveTimer=null;
function saveStateSoon(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }catch(e){ showToast("儲存失敗，裝置儲存空間可能已滿"); }
  }, 200);
}

/* ---- JSON backup / restore ---- */
function exportBackup(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "moneyapp-backup-" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    state.lastBackupAt = new Date().toISOString();
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }catch(e){}
    showToast("備份已匯出");
    render();
  }catch(e){ showToast("匯出失敗"); }
}
function importBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.accounts || !data.transactions) throw new Error("bad format");
      state = data;
      if(!state.cards) state.cards = [];
      if(!state.categories) state.categories = [];
      if(!state.transfers) state.transfers = [];
      if(!state.cardPayments) state.cardPayments = [];
      if(!state.budgets) state.budgets = {};
      saveStateSoon();
      render();
      showToast("已還原備份");
    }catch(e){ showToast("備份檔案格式錯誤"); }
  };
  reader.readAsText(file);
  evt.target.value = "";
}

function formatBackupTime(iso){
  if(!iso) return "尚未備份";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "尚未備份";
  return d.toLocaleString("zh-TW", {
    year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit"
  }).replace(/\\//g,"/");
}

/* ============ default seed data ============ */
function seedState(){
  return {
    accounts:[
      {id:"a1", name:"國泰銀行", type:"bank", initialBalance:20000},
      {id:"a2", name:"台新銀行", type:"bank", initialBalance:10000},
      {id:"a3", name:"現金", type:"cash", initialBalance:2000},
    ],
    cards:[
      {id:"c1", name:"國泰 CUBE", statementDay:15, dueDay:3, dueAccountId:"a1"},
      {id:"c2", name:"台新 @GoGo", statementDay:20, dueDay:5, dueAccountId:"a2"},
    ],
    categories:[
      {id:"cat1", name:"飲食", icon:"🍚"},
      {id:"cat2", name:"購物", icon:"🛍️"},
      {id:"cat3", name:"交通", icon:"🚗"},
      {id:"cat4", name:"生活", icon:"🏠"},
      {id:"cat5", name:"興趣", icon:"🎀"},
      {id:"cat6", name:"其他", icon:"✨"},
    ],
    transactions:[],
    transfers:[],
    cardPayments:[],
    budgets:{}
  };
}

let state = null;

/* ============ utils ============ */
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function monthKeyOf(dateStr){ return dateStr.slice(0,7); }
function curMonthKey(){ return todayStr().slice(0,7); }
function fmt(n){
  n = Math.round(n);
  const neg = n<0; n=Math.abs(n);
  const s = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg?"-":"") + "$" + s;
}
function monthLabel(mk){ const [y,m]=mk.split("-"); return `${y} / ${m}`; }
function addMonths(mk, delta){
  let [y,m] = mk.split("-").map(Number);
  m += delta;
  while(m>12){m-=12;y++;}
  while(m<1){m+=12;y--;}
  return y+"-"+String(m).padStart(2,"0");
}
function getAccount(id){ return state.accounts.find(a=>a.id===id); }
function getCard(id){ return state.cards.find(c=>c.id===id); }
function getCategory(id){ return state.categories.find(c=>c.id===id); }

/* ---- derived computations ---- */
function computeAccountBalance(accId){
  const acc = getAccount(accId);
  if(!acc) return 0;
  let bal = acc.initialBalance;
  state.transactions.forEach(t=>{
    if(t.methodType==="account" && t.methodId===accId){
      bal += (t.kind==="income" ? t.amount : -t.amount);
    }
  });
  state.transfers.forEach(tr=>{
    if(tr.fromId===accId) bal -= tr.amount;
    if(tr.toId===accId) bal += tr.amount;
  });
  state.cardPayments.forEach(p=>{
    if(p.fromAccountId===accId) bal -= p.amount;
  });
  return bal;
}
function computeCardBill(cardId){
  let bill = 0;
  state.transactions.forEach(t=>{
    if(t.methodType==="card" && t.methodId===cardId && t.kind==="expense") bill += t.amount;
  });
  state.cardPayments.forEach(p=>{
    if(p.cardId===cardId) bill -= p.amount;
  });
  return bill;
}
function nextDueDate(card){
  const today = new Date();
  const y = today.getFullYear(), m = today.getMonth(); // 0-based
  const day = card.dueDay;
  let candidate = new Date(y, m, day);
  if(candidate < new Date(y, today.getMonth(), today.getDate())) {
    candidate = new Date(y, m+1, day);
  }
  return candidate;
}
function fmtDate(d){
  return `${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}
function computeMonthSummary(mk){
  let income=0, expense=0;
  state.transactions.forEach(t=>{
    if(monthKeyOf(t.date)===mk){
      if(t.kind==="income") income+=t.amount; else expense+=t.amount;
    }
  });
  return {income, expense, remain: income-expense};
}
function computeCategorySpend(mk, catId){
  let s=0;
  state.transactions.forEach(t=>{
    if(t.kind==="expense" && monthKeyOf(t.date)===mk && t.categoryId===catId) s+=t.amount;
  });
  return s;
}

/* ============ nav / screen state ============ */
let currentTab = "home";
let addFlow = null;
let statsMonth = null;

const NAV = [
  {key:"home", icon:"🏠", label:"首頁"},
  {key:"records", icon:"📖", label:"記帳"},
  {key:"accounts", icon:"💳", label:"帳戶"},
  {key:"stats", icon:"📊", label:"統計"},
];

function renderNav(){
  const el = document.getElementById("bottomnav");
  el.innerHTML = NAV.map(n=>`
    <button class="navbtn ${currentTab===n.key?'active':''}" onclick="switchTab('${n.key}')">
      <span class="ic">${n.icon}</span><span>${n.label}</span>
    </button>`).join("");
}
function switchTab(key){
  currentTab = key;
  render();
}

function render(){
  renderNav();
  const el = document.getElementById("screen");
  if(currentTab==="home") el.innerHTML = renderHome();
  else if(currentTab==="records") el.innerHTML = renderRecords();
  else if(currentTab==="accounts") el.innerHTML = renderAccounts();
  else if(currentTab==="stats") el.innerHTML = renderStats();
  window.scrollTo(0,0);
}

function showToast(msg){
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast">${msg}</div>`;
  setTimeout(()=>{ root.innerHTML=""; }, 1600);
}

/* ============ HOME ============ */
function renderHome(){
  const mk = curMonthKey();
  const sum = computeMonthSummary(mk);
  const upcoming = state.cards
    .map(c=>({card:c, bill:computeCardBill(c.id), due:nextDueDate(c)}))
    .filter(x=>x.bill>0)
    .sort((a,b)=>a.due-b.due);

  const budgetMk = state.budgets[mk] || {};
  const budgetCatIds = Object.keys(budgetMk).filter(k=>budgetMk[k]>0);
  const recent = [...state.transactions].sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id)).slice(0,5);

  return `
  <div class="box box-pink">
    <div class="rowsplit">
      <div class="sec-title" style="margin:0;">${monthLabel(mk)}</div>
      <span class="tag">本月</span>
    </div>
    <div class="muted" style="margin-top:6px;">本月剩餘</div>
    <div class="big-money">${fmt(sum.remain)}</div>
    <div class="grid2" style="margin-top:10px;">
      <div class="box" style="padding:8px;box-shadow:2px 2px 0 0 var(--ink);">
        <div class="muted">收入</div><div class="mid-money" style="color:var(--good);">${fmt(sum.income)}</div>
      </div>
      <div class="box" style="padding:8px;box-shadow:2px 2px 0 0 var(--ink);">
        <div class="muted">支出</div><div class="mid-money" style="color:var(--pink-deep);">${fmt(sum.expense)}</div>
      </div>
    </div>
  </div>

  <button class="btn btn-block" onclick="openAdd('expense')">＋ 新增記帳</button>

  <div class="box">
    <div class="floathdr">
      <div class="sec-title">本月預算使用狀況</div>
      <button class="linkbtn" onclick="switchTab('stats')">查看全部</button>
    </div>
    ${budgetCatIds.length===0 ? `<div class="empty-hint">尚未設定預算，前往「統計」設定吧</div>` :
      budgetCatIds.slice(0,3).map(cid=>{
        const cat = getCategory(cid); if(!cat) return "";
        const spent = computeCategorySpend(mk, cid);
        const budget = budgetMk[cid];
        const pct = Math.min(100, Math.round(spent/budget*100));
        const over = spent>budget;
        return `<div style="margin-bottom:10px;">
          <div class="rowsplit"><span>${cat.icon} ${cat.name}</span><span class="muted">${fmt(spent)} / ${fmt(budget)}</span></div>
          <div class="progress-wrap"><div class="progress-fill ${over?'warn':(pct>85?'warn':'good')}" style="width:${pct}%;"></div></div>
          ${over ? `<div class="tag warn">⚠ ${cat.name}預算已超支</div>` : ""}
        </div>`;
      }).join("")
    }
  </div>

  <div class="box box-lav">
    <div class="sec-title">UPCOMING PAYMENT</div>
    ${upcoming.length===0 ? `<div class="empty-hint">目前沒有待扣款項目</div>` :
      upcoming.map(u=>`
        <div class="list-item">
          <div class="li-left">
            <div class="li-icon">💳</div>
            <div>
              <div class="li-title">${u.card.name}</div>
              <div class="li-sub">從 ${getAccount(u.card.dueAccountId)?.name||"—"} 扣款・${fmtDate(u.due)}</div>

        </div>`).join("")
    }

    <div class="sec-title">最近記錄</div>
    ${recent.length===0 ? `<div class="empty-hint">還沒有任何記帳紀錄，按下方 ＋ 開始記帳吧</div>` :
      recent.map(t=>renderTxRow(t)).join("")
    }
  </div>
  `;
}

function renderTxRow(t){
  const cat = t.categoryId ? getCategory(t.categoryId) : null;
  const methodName = t.methodType==="card" ? getCard(t.methodId)?.name : getAccount(t.methodId)?.name;
  const icon = t.kind==="income" ? "💰" : (cat ? cat.icon : "✨");
  const title = t.kind==="income" ? (t.note || "收入") : (cat ? cat.name : "支出");
  return `<div class="list-item" onclick="openTxDetail('${t.id}')" style="cursor:pointer;">
    <div class="li-left">
      <div class="li-icon">${icon}</div>
      <div>
        <div class="li-title">${title}${t.note && t.kind==='expense' ? ' · '+t.note : ''}</div>
        <div class="li-sub">${methodName||"—"} ・ ${t.date.slice(5)}</div>
      </div>
    </div>
    <div class="li-amt ${t.kind==='income'?'pos':'neg'}">${t.kind==='income'?'+':'-'}${fmt(t.amount)}</div>
  </div>`;
}

/* ============ RECORDS ============ */
function renderRecords(){
  const groups = {};
  [...state.transactions].sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id)).forEach(t=>{
    (groups[t.date] = groups[t.date]||[]).push(t);
  });
  const dates = Object.keys(groups).sort().reverse();
  return `
    <div class="sec-title">消費紀錄</div>
    ${dates.length===0 ? `<div class="box empty-hint">還沒有紀錄哦，點右下角 ＋ 開始記帳</div>` :
      dates.map(d=>`
        <div class="box" style="padding:10px 14px;">
          <div class="muted" style="margin-bottom:2px;font-weight:700;">${d}</div>
          ${groups[d].map(t=>renderTxRow(t)).join("")}
        </div>
      `).join("")
    }
  `;
}

function deleteTx(id){

function openAccountForm(id){
  const a = id ? getAccount(id) : null;
  openSheet(`
    <div class="closebar"><div class="sec-title" style="margin:0;">${a?"編輯帳戶":"新增帳戶"}</div><div class="xbtn" onclick="closeSheet()">✕</div></div>

      <option value="bank" ${a&&a.type==='bank'?'selected':''}>銀行帳戶</option>

    <label>初始餘額</label>
    <input id="f-bal" type="number" value="${a?a.initialBalance:0}">

      <button class="btn btn-outline" onclick="closeSheet()">取消</button>
      <button class="btn" onclick="saveAccount('${id||""}')">${a?"儲存":"新增"}</button>

    ${a ? `<button class="btn btn-warn btn-block" style="margin-top:10px;" onclick="deleteAccount('${a.id}')">刪除帳戶</button>` : ""}
  `);

function saveAccount(id){
  const name = document.getElementById("f-name").value.trim();
  const type = document.getElementById("f-type").value;
  const bal = parseFloat(document.getElementById("f-bal").value)||0;
  if(!name){ showToast("請輸入帳戶名稱"); return; }
  if(id){
    const a = getAccount(id); a.name=name; a.type=type; a.initialBalance=bal;
  }else{
    state.accounts.push({id:uid(), name, type, initialBalance:bal});
  }
  saveStateSoon(); closeSheet(); render(); showToast("已儲存");
}
function deleteAccount(id){
  const used = state.transactions.some(t=>t.methodType==='account'&&t.methodId===id) ||
    state.transfers.some(t=>t.fromId===id||t.toId===id) ||
    state.cards.some(c=>c.dueAccountId===id);
  if(used){ showToast("此帳戶已有相關紀錄，無法刪除"); return; }
  state.accounts = state.accounts.filter(a=>a.id!==id);
  saveStateSoon(); closeSheet(); render(); showToast("已刪除");
}

function openCardForm(id){
  const c = id ? getCard(id) : null;
  const accOptions = state.accounts.map(a=>`<option value="${a.id}" ${c&&c.dueAccountId===a.id?'selected':''}>${a.name}</option>`).join("");
  openSheet(`
    <div class="closebar"><div class="sec-title" style="margin:0;">${c?"編輯信用卡":"新增信用卡"}</div><div class="xbtn" onclick="closeSheet()">✕</div></div>
    <label>信用卡名稱</label>
    <input id="f-name" value="${c?c.name:''}" placeholder="例如：國泰 CUBE">
    <div class="grid2">
      <div><label>結帳日</label><input id="f-stmt" type="number" min="1" max="31" value="${c?c.statementDay:15}"></div>
      <div><label>扣繳日（次月）</label><input id="f-due" type="number" min="1" max="31" value="${c?c.dueDay:5}"></div>
    </div>
    <label>扣繳帳戶</label>
    <select id="f-acc">${accOptions || '<option value="">請先新增銀行帳戶</option>'}</select>
    <div class="grid2" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="closeSheet()">取消</button>
      <button class="btn" onclick="saveCard('${id||""}')">${c?"儲存":"新增"}</button>
    </div>
    ${c ? `<button class="btn btn-warn btn-block" style="margin-top:10px;" onclick="deleteCard('${c.id}')">刪除信用卡</button>` : ""}
  `);
}
function saveCard(id){
  const name = document.getElementById("f-name").value.trim();
  const statementDay = parseInt(document.getElementById("f-stmt").value)||1;
  const dueDay = parseInt(document.getElementById("f-due").value)||1;
  const dueAccountId = document.getElementById("f-acc").value;
  if(!name){ showToast("請輸入卡片名稱"); return; }
  if(!dueAccountId){ showToast("請先新增銀行帳戶"); return; }
  if(id){
    const c = getCard(id); c.name=name; c.statementDay=statementDay; c.dueDay=dueDay; c.dueAccountId=dueAccountId;
  }else{
    state.cards.push({id:uid(), name, statementDay, dueDay, dueAccountId});
  }
  saveStateSoon(); closeSheet(); render(); showToast("已儲存");
}
function deleteCard(id){
  const used = state.transactions.some(t=>t.methodType==='card'&&t.methodId===id);
  if(used){ showToast("此卡已有消費紀錄，無法刪除"); return; }
  state.cards = state.cards.filter(c=>c.id!==id);
  saveStateSoon(); closeSheet(); render(); showToast("已刪除");
}
function openCardDetail(id){
  const c = getCard(id); if(!c) return;
  const bill = computeCardBill(id);
  const due = nextDueDate(c);
  const accName = getAccount(c.dueAccountId)?.name || "—";
  openSheet(`
    <div class="closebar"><div class="sec-title" style="margin:0;">💳 ${c.name}</div><div class="xbtn" onclick="closeSheet()">✕</div></div>
    <div class="box box-pink" style="text-align:center;">
      <div class="muted">本期消費</div>
      <div class="big-money">${fmt(bill)}</div>
    </div>
    <div class="box" style="margin-top:10px;">
      <div class="rowsplit"><span class="muted">結帳日</span><span>${c.statementDay} 日</span></div>
      <hr class="dash">
      <div class="rowsplit"><span class="muted">扣繳日</span><span>次月 ${c.dueDay} 日（${fmtDate(due)}）</span></div>
      <hr class="dash">
      <div class="rowsplit"><span class="muted">扣繳帳戶</span><span>${accName}</span></div>
    </div>
    ${bill>0 ? `<button class="btn btn-block" style="margin-top:12px;" onclick="markCardPaid('${c.id}')">✓ 標記本期已扣款</button>
    <div class="muted" style="margin-top:6px;">扣款日到期時，請手動按下此按鈕，系統會從扣繳帳戶自動扣除本期帳單金額。</div>` : `<div class="empty-hint">本期尚無消費 🌷</div>`}
    <div class="grid2" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="openCardForm('${c.id}')">編輯卡片設定</button>
      <button class="btn btn-warn" onclick="deleteCard('${c.id}')">刪除</button>
    </div>
  `);
}
function markCardPaid(cardId){
  const c = getCard(cardId);
  const bill = computeCardBill(cardId);
  if(bill<=0) return;
  state.cardPayments.push({id:uid(), date:todayStr(), cardId, amount:bill, fromAccountId:c.dueAccountId});
  saveStateSoon(); closeSheet(); render(); showToast(`已從${getAccount(c.dueAccountId)?.name}扣款 ${fmt(bill)}`);
}

function openCategoryForm(id){
  const c = id ? getCategory(id) : null;
  const icons = ["🍚","🛍️","🚗","🏠","🎀","✨","☕","🍰","📱","💊","🎮","✈️","🎬","📚","🐾","💇","🧾","🎁"];
  openSheet(`
    <div class="closebar"><div class="sec-title" style="margin:0;">${c?"編輯類別":"新增類別"}</div><div class="xbtn" onclick="closeSheet()">✕</div></div>
    <label>類別名稱</label>
    <input id="f-name" value="${c?c.name:''}" placeholder="例如：飲食">
    <label>圖示</label>
    <input type="hidden" id="f-icon" value="${c?c.icon:'✨'}">
    <div class="iconpick" id="iconpick">
      ${icons.map(ic=>`<span class="${(c?c.icon:'✨')===ic?'sel':''}" onclick="pickIcon(this,'${ic}')">${ic}</span>`).join("")}
    </div>
    <div class="grid2" style="margin-top:16px;">
      <button class="btn btn-outline" onclick="closeSheet()">取消</button>
      <button class="btn" onclick="saveCategory('${id||""}')">${c?"儲存":"新增"}</button>

    ${c ? `<button class="btn btn-warn btn-block" style="margin-top:10px;" onclick="deleteCategory('${c.id}')">刪除類別</button>` : ""}

function pickIcon(el, ic){
  document.getElementById("f-icon").value = ic;
  document.querySelectorAll("#iconpick span").forEach(s=>s.classList.remove("sel"));
  el.classList.add("sel");
}
function saveCategory(id){
  const name = document.getElementById("f-name").value.trim();
  const icon = document.getElementById("f-icon").value;
  if(!name){ showToast("請輸入類別名稱"); return; }
  if(id){
    const c = getCategory(id); c.name=name; c.icon=icon;
  }else{
    state.categories.push({id:uid(), name, icon});
  }
  saveStateSoon(); closeSheet(); render(); showToast("已儲存");
}
function deleteCategory(id){
  const used = state.transactions.some(t=>t.categoryId===id);
  if(used){ showToast("此類別已有紀錄，無法刪除"); return; }
  state.categories = state.categories.filter(c=>c.id!==id);
  Object.values(state.budgets).forEach(b=>{ delete b[id]; });
  saveStateSoon(); closeSheet(); render(); showToast("已刪除");
}

function openTransferForm(){
  if(state.accounts.length<2){ showToast("請先新增至少 2 個帳戶"); return; }
  const opts = (excludeId)=> state.accounts.filter(a=>a.id!==excludeId).map(a=>`<option value="${a.id}">${a.name}</option>`).join("");
  openSheet(`
    <div class="closebar"><div class="sec-title" style="margin:0;">↔ 帳戶轉帳</div><div class="xbtn" onclick="closeSheet()">✕</div></div>
    <label>從</label>
    <select id="f-from" onchange="renderTransferTo()">${state.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join("")}</select>
    <label>到</label>
    <select id="f-to">${opts(state.accounts[0].id)}</select>
    <label>金額</label>
    <input id="f-amt" type="number" placeholder="0">
    <div class="muted" style="margin-top:6px;">轉帳不計入本月支出統計</div>
    <button class="btn btn-block" style="margin-top:16px;" onclick="saveTransfer()">確認轉帳</button>
  `);
}
function renderTransferTo(){
  const fromId = document.getElementById("f-from").value;
  document.getElementById("f-to").innerHTML = state.accounts.filter(a=>a.id!==fromId).map(a=>`<option value="${a.id}">${a.name}</option>`).join("");
}
function saveTransfer(){
  const fromId = document.getElementById("f-from").value;
  const toId = document.getElementById("f-to").value;
  const amount = parseFloat(document.getElementById("f-amt").value);
  if(!amount || amount<=0){ showToast("請輸入正確金額"); return; }
  if(fromId===toId){ showToast("轉出與轉入帳戶不能相同"); return; }
  state.transfers.push({id:uid(), date:todayStr(), fromId, toId, amount});
  saveStateSoon(); closeSheet(); render(); showToast("轉帳完成");
}

/* ============ STATS ============ */
function renderStats(){
  if(!statsMonth) statsMonth = curMonthKey();
  const mk = statsMonth;
  const sum = computeMonthSummary(mk);
  const budgetMk = state.budgets[mk] || {};

  const catSpend = state.categories.map(c=>({cat:c, spend:computeCategorySpend(mk,c.id)})).filter(x=>x.spend>0)
    .sort((a,b)=>b.spend-a.spend);

  const cardSpend = state.cards.map(c=>{
    let s=0; state.transactions.forEach(t=>{ if(t.kind==='expense'&&t.methodType==='card'&&t.methodId===c.id&&monthKeyOf(t.date)===mk) s+=t.amount; });
    return {card:c, spend:s};
  }).filter(x=>x.spend>0).sort((a,b)=>b.spend-a.spend);

  const accSpend = state.accounts.map(a=>{
    let s=0; state.transactions.forEach(t=>{ if(t.kind==='expense'&&t.methodType==='account'&&t.methodId===a.id&&monthKeyOf(t.date)===mk) s+=t.amount; });
    return {acc:a, spend:s};
  }).filter(x=>x.spend>0).sort((a,b)=>b.spend-a.spend);

  return `
    <div class="rowsplit">
      <div class="sec-title" style="margin:0;">月度統計</div>
    </div>
    <div class="box box-pink">
      <div class="rowsplit">
        <button class="btn btn-sm btn-outline" onclick="changeStatsMonth(-1)">‹</button>
        <div class="pixel" style="font-size:13px;">${monthLabel(mk)}</div>
        <button class="btn btn-sm btn-outline" onclick="changeStatsMonth(1)">›</button>
      </div>
      <div class="grid3" style="margin-top:10px;text-align:center;">
        <div><div class="muted">收入</div><div class="mid-money" style="color:var(--good);font-size:12px;">${fmt(sum.income)}</div></div>
        <div><div class="muted">支出</div><div class="mid-money" style="color:var(--pink-deep);font-size:12px;">${fmt(sum.expense)}</div></div>
        <div><div class="muted">剩餘</div><div class="mid-money" style="font-size:12px;">${fmt(sum.remain)}</div></div>
      </div>
    </div>

    <div class="box">
      <div class="sec-title">類別支出</div>
      ${catSpend.length===0 ? `<div class="empty-hint">本月尚無支出</div>` :
        catSpend.map(x=>`<div class="list-item"><div class="li-left"><div class="li-icon">${x.cat.icon}</div><div class="li-title">${x.cat.name}</div></div><div class="li-amt neg">${fmt(x.spend)}</div></div>`).join("")
      }
    </div>

    <div class="box">
      <div class="floathdr"><div class="sec-title">每月預算設定</div></div>
      ${state.categories.map(c=>{
        const val = budgetMk[c.id]||0;
        return `<div class="rowsplit" style="margin-bottom:8px;">
          <span>${c.icon} ${c.name}</span>
          <input type="number" style="width:110px;text-align:right;" value="${val||''}" placeholder="0"
            onchange="setBudget('${mk}','${c.id}',this.value)">
        </div>`;
      }).join("")}
      <div class="muted">設定後首頁及統計會自動顯示預算進度</div>
    </div>

    ${cardSpend.length>0 ? `<div class="box">
      <div class="sec-title">信用卡花費排行</div>
      ${cardSpend.map(x=>`<div class="list-item"><div class="li-left"><div class="li-icon">💳</div><div class="li-title">${x.card.name}</div></div><div class="li-amt neg">${fmt(x.spend)}</div></div>`).join("")}
    </div>` : ""}

    ${accSpend.length>0 ? `<div class="box">
      <div class="sec-title">帳戶支出排行</div>
      ${accSpend.map(x=>`<div class="list-item"><div class="li-left"><div class="li-icon">${x.acc.type==='cash'?'💵':'🏦'}</div><div class="li-title">${x.acc.name}</div></div><div class="li-amt neg">${fmt(x.spend)}</div></div>`).join("")}
    </div>` : ""}
  `;
}
function changeStatsMonth(delta){
  statsMonth = addMonths(statsMonth, delta);
  render();
}
function setBudget(mk, catId, val){
  const n = parseFloat(val)||0;
  if(!state.budgets[mk]) state.budgets[mk]={};
  state.budgets[mk][catId]=n;
  saveStateSoon(); render(); showToast("預算已更新");
}

/* ============ ADD TRANSACTION FLOW ============ */
function openAdd(kind){
  if(state.accounts.length===0 && state.cards.length===0){
    showToast("請先在「帳戶」新增付款方式");
    switchTab('accounts');
    return;
  }
  addFlow = {kind, methodType:null, methodId:null, categoryId:null, amount:"", note:"", date:todayStr(), step:1, editingId:null};
  renderAddOverlay();
}
function closeAdd(){
  addFlow = null;
  document.getElementById("modal-root").innerHTML = "";
}
function renderAddOverlay(){
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="overlay" onclick="if(event.target===this) closeAdd()"><div class="sheet" id="add-sheet"></div></div>`;
  document.getElementById("add-sheet").innerHTML = renderAddStep();
}
function totalSteps(){ return addFlow.kind==='income' ? 2 : 3; }

function renderAddStep(){
  const f = addFlow;
  const steps = totalSteps();
  let dots = "";
  for(let i=1;i<=steps;i++) dots += `<div class="dot ${f.step>=i?'on':''}"></div>`;

  let body = "";
  if(f.step===1){
    // method
    const label = f.kind==='income' ? "選擇入帳帳戶" : "選擇付款方式";
    const methodTiles = [];
    state.accounts.forEach(a=>{
      methodTiles.push(`<div class="pick-tile ${f.methodType==='account'&&f.methodId===a.id?'selected':''}" onclick="pickMethod('account','${a.id}')">
        <span class="em">${a.type==='cash'?'💵':'🏦'}</span>${a.name}<span class="sub">${fmt(computeAccountBalance(a.id))}</span></div>`);
    });
    if(f.kind==='expense'){
      state.cards.forEach(c=>{
        methodTiles.push(`<div class="pick-tile ${f.methodType==='card'&&f.methodId===c.id?'selected':''}" onclick="pickMethod('card','${c.id}')">
          <span class="em">💳</span>${c.name}<span class="sub">本期 ${fmt(computeCardBill(c.id))}</span></div>`);
      });
    }
    body = `<div class="sec-title">STEP 1・${label}</div><div class="grid2">${methodTiles.join("")}</div>`;
  } else if(f.step===2 && f.kind==='expense'){
    body = `<div class="sec-title">STEP 2・選擇消費類別</div><div class="grid3">
      ${state.categories.map(c=>`<div class="pick-tile ${f.categoryId===c.id?'selected':''}" onclick="pickCategory('${c.id}')"><span class="em">${c.icon}</span>${c.name}</div>`).join("")}
    </div>`;
  } else {
    // amount step (step2 for income, step3 for expense)
    const label = f.kind==='income' ? "輸入收入金額" : "輸入金額";
    body = `<div class="sec-title">STEP ${steps}・${label}</div>
      <div class="amt-display">${f.amount ? "$"+Number(f.amount).toLocaleString() : "$0"}</div>
      <div class="keypad">
        ${["1","2","3","4","5","6","7","8","9","0","000","⌫"].map(k=>`<button onclick="keypadPress('${k}')">${k}</button>`).join("")}
      </div>
      <label>備註（選填）</label>
      <input id="f-note" value="${f.note}" placeholder="輸入備註..." oninput="addFlow.note=this.value">
      <label>日期</label>
      <input id="f-date" type="date" value="${f.date}" onchange="addFlow.date=this.value">
      <button class="btn btn-block" style="margin-top:16px;" onclick="submitTx()">♡ ${f.editingId?'儲存變更':'記帳'}</button>
    `;
  }

  return `
    <div class="sheet-handle"></div>
    <div class="closebar">
      <div style="display:flex;gap:8px;align-items:center;">
        ${f.step>1 ? `<div class="xbtn" onclick="addStepBack()">‹</div>` : ""}
        <div class="sec-title" style="margin:0;">${f.kind==='income'?'新增收入':'新增記帳'}</div>
      </div>
      <div class="xbtn" onclick="closeAdd()">✕</div>
    </div>
    <div class="stepbar">${dots}</div>
    ${body}
    ${f.step===1 ? `<div class="rowsplit" style="margin-top:14px;">
        <span class="muted">類型：</span>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm ${f.kind==='expense'?'':'btn-outline'}" onclick="switchAddKind('expense')">支出</button>
          <button class="btn btn-sm ${f.kind==='income'?'':'btn-outline'}" onclick="switchAddKind('income')">收入</button>
        </div>
      </div>` : ""}
  `;
}
function switchAddKind(kind){
  if(addFlow.editingId) return;
  addFlow.kind = kind;
  addFlow.categoryId=null;
  refreshAddSheet();
}
function pickMethod(type,id){
  addFlow.methodType = type; addFlow.methodId = id;
  addFlow.step = 2;
  refreshAddSheet();
}
function pickCategory(id){
  addFlow.categoryId = id;
  addFlow.step = 3;
  refreshAddSheet();
}
function addStepBack(){
  addFlow.step -= 1;
  refreshAddSheet();
}
function keypadPress(k){
  let a = addFlow.amount || "";
  if(k==="⌫"){ a = a.slice(0,-1); }
  else if(k==="000"){ if(a && a!=="0") a += "000"; }
  else { if(a==="0") a=k; else a += k; }
  if(a.length>9) return;
  addFlow.amount = a;
  refreshAddSheet(true);
}
function refreshAddSheet(keepFocus){
  document.getElementById("add-sheet").innerHTML = renderAddStep();
}
function submitTx(){
  const f = addFlow;
  const amt = parseFloat(f.amount);
  if(!amt || amt<=0){ showToast("請輸入金額"); return; }
  if(!f.methodType){ showToast("請選擇方式"); return; }
  if(f.kind==='expense' && !f.categoryId){ showToast("請選擇類別"); return; }
  const note = document.getElementById("f-note") ? document.getElementById("f-note").value : f.note;
  const date = document.getElementById("f-date") ? document.getElementById("f-date").value : f.date;

  if(f.editingId){
    const t = state.transactions.find(x=>x.id===f.editingId);
    Object.assign(t, {kind:f.kind, methodType:f.methodType, methodId:f.methodId, categoryId:f.categoryId||null, amount:amt, note, date});
  }else{
    state.transactions.push({id:uid(), kind:f.kind, methodType:f.methodType, methodId:f.methodId, categoryId:f.categoryId||null, amount:amt, note, date});
  }
  saveStateSoon();
  closeAdd();
  render();
  showToast(f.kind==='income' ? "收入已記錄 💰" : "記帳完成 ♡");
}

/* ============ generic bottom sheet (for forms/details) ============ */
function openSheet(html){
  document.getElementById("modal-root").innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeSheet()">
      <div class="sheet"><div class="sheet-handle"></div>${html}</div>
    </div>`;
}
function closeSheet(){
  document.getElementById("modal-root").innerHTML = "";
}

/* ============ init ============ */
function init(){
  const loaded = loadState();
  state = loaded || seedState();
  if(!state.cardPayments) state.cardPayments = [];
  if(!state.budgets) state.budgets = {};
  render();
  if(!loaded) saveStateSoon();
}
init();
</script>
</body>
